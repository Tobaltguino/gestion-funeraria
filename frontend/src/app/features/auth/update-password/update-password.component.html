<div class="login-wrapper">

  <mat-card class="login-card" appearance="outlined">
    
    <div class="login-header">
      <img src="assets/logo-funeraria.svg" alt="A la Luz de Cristo" class="login-logo">
      <h1 class="login-title">Nueva Contraseña</h1>
      <p class="login-subtitle" *ngIf="!mensajeExito">Cree una nueva contraseña segura para su cuenta.</p>
    </div>

    <!-- Alertas -->
    <div class="alert alert-success" *ngIf="mensajeExito">
      <mat-icon>check_circle</mat-icon>
      <p>{{ mensajeExito }} <br> Redirigiendo al inicio de sesión...</p>
    </div>

    <div class="alert alert-error" *ngIf="mensajeError">
      <mat-icon>error</mat-icon>
      <p>{{ mensajeError }}</p>
    </div>

    <!-- Formulario -->
    <form [formGroup]="updateForm" (ngSubmit)="onSubmit()" class="login-form" *ngIf="!mensajeExito">
      
      <!-- Contraseña Nueva -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nueva Contraseña</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput [type]="hidePassword1 ? 'password' : 'text'" formControlName="password">
        <button mat-icon-button matSuffix type="button" (click)="hidePassword1 = !hidePassword1">
          <mat-icon>{{ hidePassword1 ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <!-- Confirmar Contraseña -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Confirmar Contraseña</mat-label>
        <mat-icon matPrefix>lock_outline</mat-icon>
        <input matInput [type]="hidePassword2 ? 'password' : 'text'" formControlName="confirmPassword">
        <button mat-icon-button matSuffix type="button" (click)="hidePassword2 = !hidePassword2">
          <mat-icon>{{ hidePassword2 ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <!-- Mensaje de error si no coinciden -->
        <mat-error *ngIf="updateForm.hasError('mismatch') && updateForm.get('confirmPassword')?.touched">
          Las contraseñas no coinciden.
        </mat-error>
      </mat-form-field>

      <button mat-flat-button class="btn-submit w-100" type="submit" [disabled]="updateForm.invalid || loading">
        <span *ngIf="!loading">Guardar Contraseña</span>
        <mat-spinner *ngIf="loading" diameter="24" color="accent"></mat-spinner>
      </button>

    </form>
    
  </mat-card>

</div>
