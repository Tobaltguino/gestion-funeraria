<mat-sidenav-container class="admin-container" autosize *ngIf="!cargando">
  
  <!-- Comportamiento dinámico: 
       Celular = mode:"over", cerrado por defecto. No usa clase "collapsed".
       PC = mode:"side", abierto por defecto. Usa clase "collapsed" según botón. -->
  <mat-sidenav #sidenav 
               [mode]="isMobile ? 'over' : 'side'" 
               [opened]="!isMobile" 
               class="admin-sidenav" 
               [class.collapsed]="!isMobile && isCollapsed">
               
    <div class="sidenav-header">
      <img src="assets/logo-funeraria.svg" alt="Logo" class="sidenav-logo">
      
      <!-- Este botón para "achicar" solo tiene sentido en el PC -->
      <button mat-icon-button (click)="toggleMenu()" class="menu-btn-sidebar" *ngIf="!isMobile">
        <mat-icon>menu</mat-icon>
      </button>
    </div>

    <mat-nav-list class="admin-nav-list">
      <ng-container *ngFor="let grupo of menuFiltrado">
        
        <div class="menu-section-title">{{ grupo.seccion }}</div>

        <!-- Agregamos (click)="cerrarMenuMovil()" a cada enlace -->
        <a mat-list-item *ngFor="let opcion of grupo.opciones" 
           [routerLink]="opcion.ruta" 
           routerLinkActive="active-link"
           (click)="cerrarMenuMovil()">
          <mat-icon matListItemIcon>{{ opcion.icono }}</mat-icon>
          <span matListItemTitle class="menu-text">{{ opcion.titulo }}</span>
        </a>

      </ng-container>
    </mat-nav-list>
  </mat-sidenav>

  <!-- Contenido Principal -->
  <mat-sidenav-content class="admin-content">
    
    <mat-toolbar class="admin-toolbar">
      
      <!-- Si estamos en celular, aquí aparece el botón para abrir el menú -->
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-btn" *ngIf="isMobile">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="spacer"></span>

      <!-- Menú de Usuario -->
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-btn">
        <mat-icon>account_circle</mat-icon>
        <span class="user-name">{{ usuarioActual?.nombre || 'Usuario' }}</span>
        <mat-icon>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <div class="menu-profile-info">
          <p class="profile-name">{{ usuarioActual?.nombre }}</p>
          <p class="profile-role">{{ usuarioActual?.rol | uppercase }}</p>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="cerrarSesion()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar Sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="main-workspace">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>

<div class="loading-overlay" *ngIf="cargando">
  <mat-spinner diameter="40"></mat-spinner>
</div>
