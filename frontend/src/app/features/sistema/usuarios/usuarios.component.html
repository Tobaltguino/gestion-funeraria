<div class="page-container">
  
  <!-- Encabezado de la página (Reemplazar esta parte) -->
  <div class="page-header">
    <div class="header-title">
      <h2>Gestión de Usuarios</h2>
      <p class="subtitle">Administra los accesos y roles del personal.</p>
    </div>
    
    <!-- Botón verde personalizado -->
    <button mat-flat-button class="btn-crear-verde" (click)="crearUsuario()">
      <mat-icon>person_add</mat-icon>
      Nuevo Usuario
    </button>
  </div>

  <!-- Spinner de carga -->
  <div class="loading-container" *ngIf="cargando">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <!-- Tabla de Usuarios -->
  <div class="table-container mat-elevation-z2" *ngIf="!cargando">
    <table mat-table [dataSource]="usuarios">

      <!-- Columna Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre Completo </th>
        <td mat-cell *matCellDef="let u"> {{ u.nombre }} </td>
      </ng-container>

      <!-- Columna RUT -->
      <ng-container matColumnDef="rut">
        <th mat-header-cell *matHeaderCellDef> RUT </th>
        <td mat-cell *matCellDef="let u"> {{ u.rut }} </td>
      </ng-container>

      <!-- Columna Rol -->
      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef> Rol </th>
        <td mat-cell *matCellDef="let u" class="celda-rol"> 
          {{ u.rol | uppercase }} 
        </td>
      </ng-container>

      <!-- Columna Teléfono -->
      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef> Teléfono </th>
        <td mat-cell *matCellDef="let u"> {{ u.telefono || 'Sin registro' }} </td>
      </ng-container>

      <!-- Columna Estado -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let u">
          <mat-chip [color]="u.activo ? 'primary' : 'warn'" selected>
            {{ u.activo ? 'Activo' : 'Inactivo' }}
          </mat-chip>
        </td>
      </ng-container>

      <!-- Columna Acciones (Reemplazar esta parte) -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Acciones </th>
        <td mat-cell *matCellDef="let u" class="acciones-cell text-center">
          
          <!-- Editar (Amarillo) - SIEMPRE HABILITADO -->
          <button mat-icon-button class="btn-editar-amarillo" matTooltip="Editar información" (click)="editarUsuario(u)">
            <mat-icon>edit</mat-icon>
          </button>

          <!-- Activar / Desactivar (Candado Rojo/Verde) - DESHABILITADO SI ES ÉL MISMO -->
          <button mat-icon-button 
                  [disabled]="u.id === currentUserId"
                  [ngClass]="u.activo ? 'btn-candado-rojo' : 'btn-candado-verde'"
                  [matTooltip]="u.activo ? 'Bloquear acceso' : 'Desbloquear acceso'" 
                  (click)="alternarEstado(u)">
            <mat-icon>{{ u.activo ? 'lock' : 'lock_open' }}</mat-icon>
          </button>

          <!-- Eliminar (Rojo) - DESHABILITADO SI ES ÉL MISMO -->
          <button mat-icon-button 
                  [disabled]="u.id === currentUserId"
                  class="btn-eliminar-rojo" 
                  matTooltip="Eliminar usuario" 
                  (click)="eliminarUsuario(u)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <!-- Renderizado de las filas -->
      <tr mat-header-row *matHeaderRowDef="columnasMostrar"></tr>
      <tr mat-row *matRowDef="let row; columns: columnasMostrar;" [class.inactivo]="!row.activo"></tr>
      
      <!-- Mensaje si no hay datos -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell text-center" colspan="6" style="padding: 2rem;">
          No se encontraron usuarios registrados.
        </td>
      </tr>
    </table>
  </div>
</div>
