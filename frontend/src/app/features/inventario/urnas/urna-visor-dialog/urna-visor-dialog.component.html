<div class="visor-header">
  <h2 mat-dialog-title class="dialog-title">{{ urna.nombre }}</h2>
  <button mat-icon-button (click)="cerrarDialogo()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <!-- Información Rápida -->
  <div class="visor-info-rapida">
    <div class="info-item">
      <mat-icon>inventory</mat-icon>
      <span>Stock Actual: <strong>{{ urna.stock_actual }}</strong> unidades</span>
    </div>
  </div>

  <!-- Galería de Miniaturas -->
  <h3 class="visor-gallery-title">Galería de Imágenes ({{ urna.imagenes?.length || 0 }})</h3>
  
  <div class="visor-gallery-grid" *ngIf="urna.imagenes && urna.imagenes.length > 0; else noFotos">
    <div class="visor-thumbnail" *ngFor="let url of urna.imagenes; let i = index" (click)="abrirImagenGrande(i)">
      <img [src]="url" alt="Foto">
      <div class="hover-overlay"><mat-icon>zoom_in</mat-icon></div>
    </div>
  </div>

  <ng-template #noFotos>
    <div class="visor-no-image">
      <mat-icon>image_not_supported</mat-icon>
      <p>No hay fotografías registradas.</p>
    </div>
  </ng-template>
</mat-dialog-content>

<!-- ============================================== -->
<!-- LIGHTBOX (Capa superpuesta a pantalla completa) -->
<!-- ============================================== -->
<div class="lightbox-overlay" *ngIf="imagenPantallaCompletaIndex !== -1" (click)="cerrarImagenGrande()">
  
  <button mat-icon-button class="lightbox-btn-close" (click)="cerrarImagenGrande()">
    <mat-icon>close</mat-icon>
  </button>

  <button mat-icon-button class="lightbox-nav-btn prev" (click)="imagenAnterior($event)" *ngIf="urna.imagenes!.length > 1">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <img [src]="urna.imagenes![imagenPantallaCompletaIndex]" class="lightbox-image" (click)="$event.stopPropagation()">

  <button mat-icon-button class="lightbox-nav-btn next" (click)="imagenSiguiente($event)" *ngIf="urna.imagenes!.length > 1">
    <mat-icon>chevron_right</mat-icon>
  </button>
  
  <div class="lightbox-counter">
    {{ imagenPantallaCompletaIndex + 1 }} / {{ urna.imagenes?.length }}
  </div>
</div>
