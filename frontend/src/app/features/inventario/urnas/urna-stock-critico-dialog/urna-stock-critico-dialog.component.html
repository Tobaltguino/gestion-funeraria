<div class="visor-header" style="border-bottom: 1px solid var(--color-linea); padding-bottom: 15px;">
  <h2 mat-dialog-title class="dialog-title" style="color: #d32f2f; display: flex; align-items: center; gap: 8px;">
    <mat-icon>warning</mat-icon> Alertas de Stock Crítico
  </h2>
  <button mat-icon-button (click)="cerrar()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  
  <div *ngIf="urnasCriticas.length === 0" style="text-align: center; padding: 40px; color: var(--color-texto-suave);">
    <mat-icon style="font-size: 48px; width: 48px; height: 48px; color: #4caf50; margin-bottom: 15px;">check_circle</mat-icon>
    <p style="font-size: 1.1rem; font-family: var(--fuente-texto);">¡Excelente! No hay urnas con stock crítico en este momento.</p>
  </div>

  <div class="table-container" *ngIf="urnasCriticas.length > 0">
    <table mat-table [dataSource]="urnasCriticas" class="w-100">
      
      <!-- Modelo -->
      <ng-container matColumnDef="modelo">
        <th mat-header-cell *matHeaderCellDef> Modelo </th>
        <td mat-cell *matCellDef="let urna"> <strong style="color: var(--color-texto);">{{ urna.nombre }}</strong> </td>
      </ng-container>

      <!-- Tipo -->
      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let urna" style="text-transform: capitalize;"> {{ urna.tipo_urna || '-' }} </td>
      </ng-container>

      <!-- Tamaño -->
      <ng-container matColumnDef="tamano">
        <th mat-header-cell *matHeaderCellDef> Tamaño </th>
        <td mat-cell *matCellDef="let urna" style="text-transform: capitalize;"> {{ urna.tamano || '-' }} </td>
      </ng-container>

      <!-- Cuerpo -->
      <ng-container matColumnDef="cuerpo">
        <th mat-header-cell *matHeaderCellDef> Cuerpo </th>
        <td mat-cell *matCellDef="let urna" style="text-transform: capitalize;"> {{ urna.cuerpo || '-' }} </td>
      </ng-container>

      <!-- Stock -->
      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Stock </th>
        <td mat-cell *matCellDef="let urna" class="text-center" style="color: #d32f2f; font-weight: 500;"> 
          {{ urna.stock_actual }} un. <br>
          <span style="font-size: 0.8rem; color: var(--color-texto-suave); font-weight: normal;">(Mín: {{ urna.kpi_alerta_stock }})</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  </div>

</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button class="btn-cancelar" (click)="cerrar()">Cerrar</button>
  
  <button mat-flat-button class="btn-submit" (click)="imprimirYDescargar()" [disabled]="urnasCriticas.length === 0">
    <mat-icon>print</mat-icon> Imprimir Reporte
  </button>
</mat-dialog-actions>
