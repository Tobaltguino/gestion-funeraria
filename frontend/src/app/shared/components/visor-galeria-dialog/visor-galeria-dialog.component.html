<div class="visor-header">
  <h2 mat-dialog-title class="dialog-title">{{ data.titulo }}</h2>
  <button mat-icon-button (click)="cerrarDialogo()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <!-- Información Rápida Dinámica -->
  <div class="visor-info-rapida" *ngIf="data.detalles && data.detalles.length > 0">
    <div class="info-item" *ngFor="let detalle of data.detalles" style="margin-bottom: 8px;">
      <mat-icon>{{ detalle.icono }}</mat-icon>
      <span>
        {{ detalle.etiqueta }}: 
        <strong [style.text-transform]="detalle.uppercase ? 'uppercase' : 'none'">
          {{ detalle.valor }}
        </strong>
      </span>
    </div>
  </div>

  <h3 class="visor-gallery-title">Galería de Imágenes ({{ data.imagenes.length }})</h3>
  
  <div class="visor-gallery-grid" *ngIf="data.imagenes && data.imagenes.length > 0; else noFotos">
    <div class="visor-thumbnail" *ngFor="let url of data.imagenes; let i = index" (click)="abrirImagenGrande(i)">
      <img [src]="url" alt="Foto">
      <div class="hover-overlay"><mat-icon>zoom_in</mat-icon></div>
    </div>
  </div>

  <ng-template #noFotos>
    <div class="visor-no-image">
      <mat-icon>image_not_supported</mat-icon>
      <p>No hay fotografías registradas.</p>
    </div>
  </ng-template>
</mat-dialog-content>

<!-- LIGHTBOX GLOBAL -->
<div class="lightbox-overlay" *ngIf="imagenPantallaCompletaIndex !== -1" (click)="cerrarImagenGrande()">
  <button mat-icon-button class="lightbox-btn-close" (click)="cerrarImagenGrande()">
    <mat-icon>close</mat-icon>
  </button>
  <button mat-icon-button class="lightbox-nav-btn prev" (click)="imagenAnterior($event)" *ngIf="data.imagenes.length > 1">
    <mat-icon>chevron_left</mat-icon>
  </button>
  <img [src]="data.imagenes[imagenPantallaCompletaIndex]" class="lightbox-image" (click)="$event.stopPropagation()">
  <button mat-icon-button class="lightbox-nav-btn next" (click)="imagenSiguiente($event)" *ngIf="data.imagenes.length > 1">
    <mat-icon>chevron_right</mat-icon>
  </button>
  <div class="lightbox-counter">
    {{ imagenPantallaCompletaIndex + 1 }} / {{ data.imagenes.length }}
  </div>
</div>
